<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elegant Light Form</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#f8fafc,#e2e8f0,#ffffff);
  padding:20px;
}

.form-box{
  width:100%;
  max-width:480px;
  background:white;
  padding:35px;
  border-radius:24px;
  box-shadow:
    0 10px 35px rgba(0,0,0,0.08);
  border:1px solid #e2e8f0;
}

.form-box h2{
  text-align:center;
  font-size:32px;
  color:#0f172a;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#64748b;
  margin-bottom:30px;
  font-size:14px;
}

.field{
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:600;
  color:#334155;
}

input,
select,
textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #cbd5e1;
  outline:none;
  font-size:15px;
  transition:0.3s ease;
  background:#f8fafc;
}

input::placeholder,
textarea::placeholder{
  color:#94a3b8;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#3b82f6;
  background:white;
  box-shadow:0 0 0 4px rgba(59,130,246,0.12);
}

.gender{
  display:flex;
  gap:20px;
  margin-top:10px;
}

.gender label{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:500;
  cursor:pointer;
}

.gender input{
  width:auto;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  color:white;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s ease;
  margin-top:10px;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(59,130,246,0.25);
}

#successMsg{
  display:none;
  margin-top:18px;
  text-align:center;
  color:#16a34a;
  font-weight:600;
}

.home-link{
  display:block;
  text-align:center;
  margin-top:25px;
  text-decoration:none;
  color:#475569;
  transition:0.3s;
}

.home-link:hover{
  color:#2563eb;
}

@media(max-width:500px){

  .form-box{
    padding:25px;
  }

  .form-box h2{
    font-size:28px;
  }

}

</style>
</head>

<body>

<div class="form-box">

  <h2>User Form</h2>
  <p class="subtitle">Please fill in your details</p>

  <form id="myForm">

    <div class="field">
      <label>Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >
    </div>

    <div class="field">
      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >
    </div>

    <div class="field">
      <label>Phone</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >
    </div>

    <div class="field">

      <label>Gender</label>

      <div class="gender">

        <label>
          <input type="radio" name="gender" value="Male" required>
          Male
        </label>

        <label>
          <input type="radio" name="gender" value="Female">
          Female
        </label>

      </div>

    </div>

    <div class="field">
      <label>Country</label>

      <select id="country">
        <option>India</option>
        <option>USA</option>
        <option>Canada</option>
      </select>
    </div>

    <div class="field">
      <label>Message</label>

      <textarea
        id="message"
        rows="4"
        placeholder="Write your message..."
      ></textarea>
    </div>

    <button type="submit">Submit Form</button>

    <p id="successMsg">
      ✓ Form submitted successfully
    </p>

  </form>

  <a
    class="home-link"
    href="https://karthikprabhu07.github.io/karthikprabhu_sem4-fet/"
  >
    ← Back to Home Page
  </a>

</div>

<script>

document.getElementById("myForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  const formData = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    gender: document.querySelector(
      'input[name="gender"]:checked'
    )?.value,
    country: document.getElementById("country").value,
    message: document.getElementById("message").value
  };

  console.log(formData);

  const success =
    document.getElementById("successMsg");

  success.style.display = "block";

  setTimeout(()=>{
    success.style.display = "none";
  },3000);

  document.getElementById("myForm").reset();

});

</script>

</body>
</html>
