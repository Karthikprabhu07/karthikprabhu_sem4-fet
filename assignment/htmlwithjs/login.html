<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secure Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:#050816;

    overflow:hidden;
}

body::before{
    content:"";

    position:absolute;

    width:350px;
    height:350px;

    background:#38bdf8;

    border-radius:50%;

    filter:blur(120px);

    top:-100px;
    left:-100px;

    opacity:0.4;
}

body::after{
    content:"";

    position:absolute;

    width:320px;
    height:320px;

    background:#8b5cf6;

    border-radius:50%;

    filter:blur(120px);

    bottom:-100px;
    right:-100px;

    opacity:0.4;
}

.container{

    position:relative;

    width:320px;

    padding:32px;

    border-radius:22px;

    background:
    rgba(255,255,255,0.06);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.08);

    text-align:center;

    color:white;

    box-shadow:
    0 8px 25px rgba(0,0,0,0.4);
}

h1{
    font-size:32px;
    margin-bottom:8px;
}

#status{
    color:#cbd5e1;
    margin-bottom:18px;
}

input{

    width:100%;

    padding:12px;

    border:none;

    outline:none;

    border-radius:12px;

    background:
    rgba(255,255,255,0.08);

    color:white;

    margin-bottom:18px;
}

input::placeholder{
    color:#94a3b8;
}

button{

    width:100%;

    padding:12px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
    to right,
    #38bdf8,
    #8b5cf6);

    color:white;

    font-weight:bold;

    cursor:pointer;
}

#attempts{
    margin-top:15px;
    color:#e2e8f0;
}

#homepage{

    display:inline-block;

    margin-top:18px;

    padding:10px 20px;

    border-radius:12px;

    text-decoration:none;

    background:
    rgba(255,255,255,0.08);

    color:white;
}

</style>
</head>

<body>

<div class="container">

    <h1>Secure Login</h1>

    <h3 id="status">
        Enter Password
    </h3>

    <input
    type="password"
    id="password"
    placeholder="Enter Password">

    <button id="loginBtn">
        Login
    </button>

    <p id="attempts">
        Attempts Left : 3
    </p>

    <a
    id="homepage"
    href="https://karthikprabhu07.github.io/karthikprabhu_sem4-fet/">

        Home Page

    </a>

</div>

<script>

let correctPassword = "admin123";

let attempts = 3;

document
.getElementById("loginBtn")
.onclick = function(){

    let userPassword =
    document
    .getElementById("password")
    .value;

    do{

        if(userPassword == correctPassword){

            document
            .getElementById("status")
            .innerHTML =
            "✅ Access Granted";

            break;
        }

        else{

            attempts--;

            document
            .getElementById("attempts")
            .innerHTML =
            "Attempts Left : " + attempts;

            if(attempts == 0){

                document
                .getElementById("status")
                .innerHTML =
                "❌ Access Locked";

                document
                .getElementById("loginBtn")
                .disabled = true;

                break;
            }

            userPassword =
            prompt("Re-enter Password");

        }

    }while(userPassword != correctPassword);

}

</script>

</body>
</html>
