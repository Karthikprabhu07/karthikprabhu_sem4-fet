<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Secure Login</title>
<style>
  body { 
    font-family: sans-serif; 
    padding: 20px; 
  }
  .container { 
    max-width: 300px; 
  }
  input, button { 
    margin-top: 10px; 
    padding: 8px; 
    width: 100%; 
    box-sizing: border-box; 
  }
</style>
</head>
<body>

<div class="container">
  <h2>Secure Login</h2>
  <h3 id="status">Enter Password</h3>
  
  <input type="password" id="password" placeholder="Enter Password">
  
  <button id="loginBtn">Login</button>
  
  <p id="attempts">Attempts Left: 3</p>
  
  <br>
  <a href="https://karthikprabhu07.github.io/karthikprabhu_sem4-fet/">← Home Page</a>
</div>

<script>

  let correctPassword = "karthik"; 
  let attempts = 3;

  document.getElementById("loginBtn").onclick = function() {
    let userPassword = document.getElementById("password").value;
    
    do {
      if (userPassword === correctPassword) {
        document.getElementById("status").innerHTML = "✅ Access Granted";
        document.getElementById("attempts").innerHTML = "Attempts Left: " + attempts;
        break; 
      } else {
        attempts--; 
        
        
        if (attempts === 0) {
          document.getElementById("status").innerHTML = "❌ Access Locked";
          document.getElementById("attempts").innerHTML = "Attempts Left: 0";
          document.getElementById("loginBtn").disabled = true;
          break; t
        }
  
        userPassword = prompt("❌ Incorrect Password!\n\nAttempts Left: " + attempts + "\n\nPlease re-enter password:");
      }
    } while (userPassword !== correctPassword);
  }
</script>

</body>
</html>
