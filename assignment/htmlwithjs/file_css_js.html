<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Matrix</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .box {
            background: white;
            width: 450px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .skill-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f0f0f0;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }

        button {
            padding: 5px 10px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Technical Skill Matrix</h2>

        <ol>

            <li>
                <strong>Software Development</strong>

                <ul>

                    <li class="skill-item">
                        <span id="s1">C Programming</span>
                        <button onclick="editSkill('s1')">Edit</button>
                    </li>

                    <li class="skill-item">
                        <span id="s2">Java Programming</span>
                        <button onclick="editSkill('s2')">Edit</button>
                    </li>

                </ul>
            </li>

            <li>
                <strong>Database Systems</strong>

                <ul>

                    <li class="skill-item">
                        <span id="s3">SQL</span>
                        <button onclick="editSkill('s3')">Edit</button>
                    </li>

                </ul>
            </li>

        </ol>
<center><a href="https://karthikprabhu07.github.io/karthikprabhu_sem4-fet/">Click for Home Page</a></center>
    </div>

    <script>

        function editSkill(id) {

            let skill = document.getElementById(id);

            let newSkill = prompt("Edit skill:", skill.innerText);

            if (newSkill != null && newSkill.trim() !== "") {
                skill.innerText = newSkill;
            }
        }

    </script>

</body>
</html>
