<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Technical Skill Matrix</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;

    background:
    linear-gradient(
        135deg,
        #eef2ff,
        #dbeafe,
        #fdf2f8
    );
}

.box{
    width:100%;
    max-width:540px;
    background:rgba(255,255,255,0.9);

    backdrop-filter:blur(12px);

    border-radius:28px;

    padding:35px;

    box-shadow:
    0 15px 40px rgba(99,102,241,0.12);

    border:
    1px solid rgba(255,255,255,0.7);
}

h2{
    text-align:center;
    margin-bottom:30px;

    font-size:34px;

    background:
    linear-gradient(
        135deg,
        #4f46e5,
        #ec4899
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.category{
    margin-bottom:28px;
}

.category-title{
    font-size:18px;
    font-weight:700;
    color:#312e81;
    margin-bottom:14px;
    padding-left:5px;
}

.skill-item{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 18px;

    margin-bottom:14px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #f8fafc
    );

    border:1px solid #e0e7ff;

    transition:0.3s ease;
}

.skill-item:hover{
    transform:translateY(-3px);

    box-shadow:
    0 12px 25px rgba(99,102,241,0.12);

    border-color:#a5b4fc;
}

.skill-name{
    font-size:15px;
    font-weight:600;
    color:#334155;
}

button{
    border:none;

    padding:11px 18px;

    border-radius:14px;

    cursor:pointer;

    color:white;

    font-weight:600;

    background:
    linear-gradient(
        135deg,
        #6366f1,
        #ec4899
    );

    transition:0.3s ease;
}

button:hover{

    transform:scale(1.05);

    box-shadow:
    0 10px 22px rgba(236,72,153,0.25);
}

.home-link{
    display:block;

    text-align:center;

    margin-top:28px;

    text-decoration:none;

    font-weight:600;

    color:#6366f1;

    transition:0.3s;
}

.home-link:hover{
    color:#ec4899;
}

@media(max-width:550px){

    .box{
        padding:25px;
    }

    h2{
        font-size:28px;
    }

    .skill-item{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    button{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="box">

    <h2>Technical Skill Matrix</h2>

    <div class="category">

        <div class="category-title">
            Software Development
        </div>

        <div class="skill-item">

            <span
            class="skill-name"
            id="s1">
                C Programming
            </span>

            <button
            onclick="editSkill('s1')">
                Edit
            </button>

        </div>

        <div class="skill-item">

            <span
            class="skill-name"
            id="s2">
                Java Programming
            </span>

            <button
            onclick="editSkill('s2')">
                Edit
            </button>

        </div>

    </div>

    <div class="category">

        <div class="category-title">
            Database Systems
        </div>

        <div class="skill-item">

            <span
            class="skill-name"
            id="s3">
                SQL
            </span>

            <button
            onclick="editSkill('s3')">
                Edit
            </button>

        </div>

    </div>

    <a
    class="home-link"
    href="https://karthikprabhu07.github.io/karthikprabhu_sem4-fet/">

        ← Back to Home Page

    </a>

</div>

<script>

function editSkill(id){

    let skill =
    document.getElementById(id);

    let newSkill =
    prompt(
        "Edit skill:",
        skill.innerText
    );

    if(
        newSkill != null &&
        newSkill.trim() !== ""
    ){
        skill.innerText = newSkill;
    }
}

</script>

</body>
</html>
