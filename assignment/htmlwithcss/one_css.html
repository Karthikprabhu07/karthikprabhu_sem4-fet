    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #3f5efb, #fc466b, #00c6ff, #0072ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: white;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            border: 2px solid white;
            border-radius: 10px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-weight: 600;
            margin-bottom: 5px;
        }

        h2 {
            font-weight: 400;
            color: black;
            margin-top: 0;
        }

        p {
            font-weight: 300;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin: 10px 5px;
            padding: 8px 15px;
            border: 1px solid white;
            border-radius: 5px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        a:hover {
            background: white;
            color: black;
        }

        img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 15px;
            }

            .footer {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
