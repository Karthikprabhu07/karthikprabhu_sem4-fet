<!DOCTYPE html>

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            background: linear-gradient(-45deg, #3f5efb, #fc466b, #00c6ff, #0072ff);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            text-align: center;
            width: 90%;
            max-width: 500px;
            color: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        h1 {
            font-weight: 600;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: 400;
            color: #00e0ff;
        }

        p {
            font-weight: 300;
            font-size: 16px;
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            background: white;
            color: black;
            font-weight: 500;
            transition: 0.3s;
        }

        a:hover {
            background: black;
            color: white;
        }

        img {
            width: 100%;
            border-radius: 15px;
            margin-top: 15px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
    </style>
</head>
